[lint]
ignore = [
    "I001",    # TODO: fix import ordering across all packages
    "ASYNC230", # TODO: replace blocking open() with async file I/O
    "BLE001",  # TODO: narrow broad Exception catches
    "TRY002",  # TODO: replace bare Exception raises with custom types
    "C408",    # TODO: rewrite dict() calls as literals
    "F401",    # TODO: add explicit re-exports where needed
    "F541",    # TODO: remove f-prefix from strings without placeholders
    "RUF010",  # TODO: use explicit conversion flags in f-strings
    "PLR1730", # TODO: replace if/min patterns with max()
]

[lint.per-file-ignores]
# TODO: pre-existing violations in SwanContents, never linted before CI (#494).
"SwanContents/**" = [
    "ASYNC210", "ASYNC221",              # blocking HTTP/subprocess calls in async functions
    "BLE001", "E722", "S110", "TRY203",  # broad / bare / useless exception handling
    "G201",                              # log.error(exc_info=True) instead of log.exception()
    "C408", "PIE810",                    # dict() calls, needless pass, chained startswith
    "SIM103", "SIM115", "SIM117", "SIM401",  # simplification suggestions
    "UP031",                             # pyupgrade modernisation
    "DTZ005", "DTZ006", "DTZ011",        # naive datetimes
    "RUF012", "PLW1510"
]
