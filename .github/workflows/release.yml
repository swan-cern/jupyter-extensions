name: Release
run-name: "Release ${{ inputs.extension }}"

on:
  workflow_dispatch:
    inputs:
      extension:
        description: "Extension name"
        required: true
        type: choice
        options:
          - SparkConnector
          - SwanContents
          - SwanCustomEnvironments
          - SwanDask
          - SwanHeader
          - SwanHelp
          - SwanKernelEnv
          - SwanMarimoProxy
          - SwanMetrics
          - SwanML
          - SwanOauthRenew
          - SwanPortAllocator
          - SwanShare
      bump:
        description: "Version bump"
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}  # Deny all permissions by default at workflow level

jobs:
  release:
    runs-on: ubuntu-latest
    environment: publish
    env:
      EXTENSION: ${{ inputs.extension }}
    permissions:
      id-token: write # Required to authenticate with gh CLI using OIDC
      contents: write # Required to push commits and tags, and create releases

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.12' # nbclassic (required by swancontents) needs the `pipes` module removed in 3.13
          enable-cache: false

      - name: Install node
        if: hashFiles(format('{0}/package.json', env.EXTENSION)) != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          package-manager-cache: false

      - name: Bump version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          # Run bump2version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cd ${EXTENSION}
          uvx bump2version ${BUMP}

          # Get the new tag and version
          TAG=$(git describe --tags --exact-match)
          VERSION=$(echo "$TAG" | cut -d / -f 2)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: |
          # Get the previous tag for this extension
          PREV_TAG=$(git describe --tags --match "${EXTENSION}/*" --abbrev=0 HEAD~1 2>/dev/null || true)
          # If there is a previous tag, get commits since that tag, otherwise get all commits
          [ -n "$PREV_TAG" ] && RANGE="$PREV_TAG..HEAD" || RANGE="HEAD"
          # Format commit messages as a markdown list & remove the extension name from the beginning of the message
          EXT_LOWER=$(echo "${EXTENSION}" | tr '[:upper:]' '[:lower:]')
          git log "$RANGE" --pretty=format:"- %B" -- "${EXTENSION}" \
            | sed -r "s/$EXT_LOWER: //g" > /tmp/release_body.md

      - name: Push version bump commit and tag
        env:
          WORKFLOW_ACCESS_TOKEN: ${{ secrets.WORKFLOW_ACCESS_TOKEN }}
        run: |
          # Bypass branch protection rules by using the workflow access token
          git remote set-url origin "https://x-access-token:${WORKFLOW_ACCESS_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin master --tags --atomic

      - name: Build wheel 📦
        run: |
          cd ${EXTENSION}
          uv build

      - name: Publish to PyPI 🚀
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: ./${{ env.EXTENSION }}/dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file /tmp/release_body.md

      - name: Trigger package update in jupyter-images
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_ACCESS_TOKEN }}
        run: |
          gh workflow run update-packages.yml \
            --repo swan-cern/jupyter-images \
            --ref master \
            -f package="${EXTENSION}" \
            -f version="${{ steps.version.outputs.version }}"
